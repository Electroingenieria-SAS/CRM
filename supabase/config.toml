project_id = "crm-reconstruction"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seeds/freight_historical_2026.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = false

[auth.rate_limit]
# Synthetic E2E performs many sign-ins against one local IP; production limits are managed separately.
sign_in_sign_ups = 1000

[inbucket]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[functions.admin-users]
verify_jwt = true

[functions.migration-source-export]
verify_jwt = true
