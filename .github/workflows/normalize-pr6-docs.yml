name: Normalize PR6 docs

on:
  push:
    branches:
      - reconstruction/p1-auth-orders-ui-e2e

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-auth-orders-ui-e2e
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format PR6 documentation
        run: >
          npx prettier --write
          docs/security/authentication.md
          docs/audit/functional-parity.md
          docs/architecture/orders-ui-e2e.md
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/security/authentication.md docs/audit/functional-parity.md docs/architecture/orders-ui-e2e.md
          git commit -m "style(docs): normalize PR6 evidence"
          git push origin HEAD:reconstruction/p1-auth-orders-ui-e2e
