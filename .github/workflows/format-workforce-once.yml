name: One-shot Workforce formatter

on:
  push:
    branches:
      - reconstruction/p1-admin-audit-assistant-release
    paths:
      - .github/workflows/format-workforce-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-admin-audit-assistant-release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/workforce.spec.ts
      - name: Commit exact format and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-workforce-once.yml
          git add tests/e2e/workforce.spec.ts
          git commit -m "chore(format): apply exact Workforce Prettier output"
          git push origin HEAD:reconstruction/p1-admin-audit-assistant-release
