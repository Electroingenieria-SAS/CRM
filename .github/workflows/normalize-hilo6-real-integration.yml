name: Normalize Hilo 6 real integration

on:
  push:
    branches:
      - reconstruction/p1-orders-workforce-automation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-orders-workforce-automation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize real integration files
        run: >
          npx prettier --write
          src/app/operations/orders-workforce/orders-workforce-indicators.tsx
          src/app/operations/orders-workforce/orders-workforce-workspace.tsx
          src/infrastructure/integrations/supabase-orders-workforce-indicators-repository.ts
          src/infrastructure/integrations/supabase-workforce-automation-adapter.ts
          tests/unit/orders-workforce-automation.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/operations/orders-workforce/orders-workforce-indicators.tsx src/app/operations/orders-workforce/orders-workforce-workspace.tsx src/infrastructure/integrations/supabase-orders-workforce-indicators-repository.ts src/infrastructure/integrations/supabase-workforce-automation-adapter.ts tests/unit/orders-workforce-automation.test.ts
          git commit -m "style(workforce): normalize real Orders-Workforce integration"
          git push origin HEAD:reconstruction/p1-orders-workforce-automation
