name: Normalize Orders Workforce tranche

on:
  push:
    branches:
      - reconstruction/p1-orders-workforce-automation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-orders-workforce-automation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize changed text files
        run: >
          npx prettier --write
          .github/workflows/pipeline.yml
          docs/ADR/ADR-0005-orders-workforce-outbox.md
          docs/architecture/orders-workforce-automation.md
          docs/database/orders-workforce-contract.md
          src/infrastructure/integrations/supabase-order-workforce-outbox-repository.ts
          src/modules/integrations/orders-workforce/application/orders-workforce.schemas.ts
          src/modules/integrations/orders-workforce/application/orders-workforce.ports.ts
          src/modules/integrations/orders-workforce/application/orders-workforce-automation-service.ts
          src/modules/integrations/orders-workforce/application/orders-workforce-indicators.ts
          tests/integration/orders-workforce-outbox-concurrency.mjs
          tests/unit/orders-workforce-automation.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pipeline.yml docs/ADR/ADR-0005-orders-workforce-outbox.md docs/architecture/orders-workforce-automation.md docs/database/orders-workforce-contract.md src/infrastructure/integrations/supabase-order-workforce-outbox-repository.ts src/modules/integrations/orders-workforce/application/orders-workforce.schemas.ts src/modules/integrations/orders-workforce/application/orders-workforce.ports.ts src/modules/integrations/orders-workforce/application/orders-workforce-automation-service.ts src/modules/integrations/orders-workforce/application/orders-workforce-indicators.ts tests/integration/orders-workforce-outbox-concurrency.mjs tests/unit/orders-workforce-automation.test.ts
          git commit -m "style(workforce): apply repository Prettier"
          git push origin HEAD:reconstruction/p1-orders-workforce-automation
