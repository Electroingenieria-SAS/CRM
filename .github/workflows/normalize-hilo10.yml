name: Normalize Hilo 10 formatting

on:
  push:
    branches:
      - reconstruction/p1-billing-logistics-delivery

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-billing-logistics-delivery
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize Hilo 10 files
        run: >
          npx prettier --write
          docs/ADR/ADR-0006-billing-logistics-ownership.md
          docs/architecture/billing-logistics-delivery.md
          docs/audit/functional-parity.md
          docs/audit/master-matrix.md
          src/app/billing
          src/app/logistics
          src/composition/billing-browser-application.ts
          src/composition/logistics-browser-application.ts
          src/infrastructure/billing
          src/infrastructure/evidence/supabase-order-evidence-storage.ts
          src/infrastructure/logistics
          src/modules/billing
          src/modules/logistics
          src/shared/evidence
          tests/e2e/authenticated-logistics.spec.ts
          tests/integration/logistics-concurrency.mjs
          tests/unit/billing-service.test.ts
          tests/unit/logistics-service.test.ts
      - name: Commit normalized files
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs src tests
          git commit -m "style(hilo10): normalize formatting"
          git push origin HEAD:reconstruction/p1-billing-logistics-delivery
