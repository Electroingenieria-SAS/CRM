name: Normalize Hilo 10 formatting

on:
  push:
    branches:
      - reconstruction/p1-billing-logistics-delivery
    paths:
      - tests/e2e/authenticated-logistics.spec.ts
      - .github/workflows/normalize-hilo10-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-billing-logistics-delivery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize target file
        run: npx prettier --write tests/e2e/authenticated-logistics.spec.ts
      - name: Commit normalization
        run: |
          if git diff --quiet -- tests/e2e/authenticated-logistics.spec.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/authenticated-logistics.spec.ts
          git commit -m "style(logistics): apply repository prettier"
          git push origin HEAD:reconstruction/p1-billing-logistics-delivery
