name: Normalize Hilo 10 formatting

on:
  push:
    branches:
      - reconstruction/p1-billing-logistics-delivery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-billing-logistics-delivery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Normalize exact Hilo 10 files
        run: >
          npx prettier --write
          src/app/billing/use-billing-loader.ts
          src/app/billing/use-billing-page-state.ts
          src/app/logistics/logistics-page-primary-delivery-actions.ts
          src/app/logistics/logistics-page-secondary-delivery-actions.ts
          src/app/logistics/logistics-workspace-body.tsx
          src/app/logistics/logistics-workspace.tsx
          src/app/logistics/use-logistics-page-state.ts
          src/modules/logistics/ui/logistics-release-panel.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/app/billing/use-billing-loader.ts             src/app/billing/use-billing-page-state.ts             src/app/logistics/logistics-page-primary-delivery-actions.ts             src/app/logistics/logistics-page-secondary-delivery-actions.ts             src/app/logistics/logistics-workspace-body.tsx             src/app/logistics/logistics-workspace.tsx             src/app/logistics/use-logistics-page-state.ts             src/modules/logistics/ui/logistics-release-panel.tsx
          git commit -m "style(logistics): normalize Hilo 10 formatting"
          git push origin HEAD:reconstruction/p1-billing-logistics-delivery
