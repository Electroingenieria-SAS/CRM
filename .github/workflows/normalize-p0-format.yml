name: Normalize P0 formatting

on:
  push:
    branches:
      - reconstruction/p0-auth-security-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p0-auth-security-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize with repository Prettier
        run: >
          npx prettier --write
          docs/audit/functional-parity.md
          docs/audit/master-matrix.md
          src/modules/auth/application/auth.schemas.ts
          src/modules/auth/infrastructure/supabase-auth-gateway.ts
          tests/unit/auth-schemas.test.ts
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/functional-parity.md docs/audit/master-matrix.md src/modules/auth/application/auth.schemas.ts src/modules/auth/infrastructure/supabase-auth-gateway.ts tests/unit/auth-schemas.test.ts
          git commit -m "style: apply repository Prettier"
          git push origin HEAD:reconstruction/p0-auth-security-foundation
