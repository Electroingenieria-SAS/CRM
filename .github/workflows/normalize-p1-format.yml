name: Normalize P1 formatting

on:
  push:
    branches:
      - reconstruction/p1-local-supabase-orders

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-local-supabase-orders
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize with repository Prettier
        run: >
          npx prettier --write
          docs/audit/functional-parity.md
          docs/audit/master-matrix.md
          src/modules/orders/application/order.schemas.ts
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/functional-parity.md docs/audit/master-matrix.md src/modules/orders/application/order.schemas.ts
          git commit -m "style: apply repository Prettier to P1 tranche"
          git push origin HEAD:reconstruction/p1-local-supabase-orders
