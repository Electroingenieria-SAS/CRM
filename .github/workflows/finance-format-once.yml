name: Finance format once

on:
  push:
    branches:
      - reconstruction/p1-financial-validation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-financial-validation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format repository with pinned Prettier
        run: npm run format
      - name: Remove one-shot workflow and commit formatting
        shell: bash
        run: |
          rm -f .github/workflows/finance-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(finance): normalize final finance formatting"
          git push origin HEAD:reconstruction/p1-financial-validation
