name: CRM quality, security and staging

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install reproducibly
        run: npm ci

      - name: Validate application
        run: npm run validate

      - name: Enforce performance budget
        run: npm run performance:budget

      - name: Generate SBOM
        run: npm sbom --sbom-format=cyclonedx > crm-sbom.cdx.json

      - name: Generate release metadata
        run: npm run release:metadata > release-metadata.json

      - name: Preserve SBOM
        uses: actions/upload-artifact@v7
        with:
          name: crm-release-evidence
          path: |
            crm-sbom.cdx.json
            release-metadata.json
          retention-days: 90

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start isolated local Supabase
        run: supabase start
      - name: Rebuild database from migrations and synthetic seed
        run: supabase db reset
      - name: Run pgTAP database and RLS tests
        run: supabase test db
      - name: Lint PostgreSQL functions
        run: supabase db lint --level error --schema public,erp_supply,erp_private
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e-staging:
    needs: [quality, database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Responsive + semantic private-shell smoke
        run: npx playwright test tests/e2e/staging-shell.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e-authenticated:
    needs: [quality, database]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start isolated Supabase and rebuild schema
        run: |
          supabase start
          supabase db reset
      - name: Prepare ephemeral QA credentials
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          PUBLIC_KEY="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          LOCAL_SECRET_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          if [ -z "${API_URL:-}" ] || [ -z "${PUBLIC_KEY:-}" ] || [ -z "${LOCAL_SECRET_KEY:-}" ] || [ -z "${DB_URL:-}" ]; then
            echo "Supabase local status did not expose the required runtime values."
            exit 1
          fi
          E2E_PASSWORD="$(openssl rand -base64 30 | tr -d '\n' | tr '/+' 'Aa')"
          echo "::add-mask::$DB_URL"
          echo "::add-mask::$LOCAL_SECRET_KEY"
          echo "::add-mask::$E2E_PASSWORD"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY"
            echo "DB_URL=$DB_URL"
            echo "SUPABASE_LOCAL_SECRET_KEY=$LOCAL_SECRET_KEY"
            echo "E2E_PASSWORD=$E2E_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Create synthetic Auth users
        run: node tests/fixtures/create-authenticated-e2e-users.mjs
      - name: Attach synthetic CRM profiles and roles
        run: >
          psql "$DB_URL"
          -v ON_ERROR_STOP=1
          -f tests/fixtures/authenticated_e2e.sql
      - name: Seed synthetic Workforce policies
        run: >
          psql "$DB_URL"
          -v ON_ERROR_STOP=1
          -f tests/fixtures/workforce_e2e.sql
      - name: Seed synthetic Customer Intelligence dataset
        run: >
          psql "$DB_URL"
          -v ON_ERROR_STOP=1
          -f tests/fixtures/customer_intelligence_e2e.sql
      - name: Seed synthetic Inventory dataset
        run: >
          psql "$DB_URL"
          -v ON_ERROR_STOP=1
          -f tests/fixtures/inventory_e2e.sql
      - name: Seed synthetic Analytics dataset
        run: >
          psql "$DB_URL"
          -v ON_ERROR_STOP=1
          -f tests/fixtures/analytics_e2e.sql
      - name: Seed synthetic Orders-Workforce integration event
        run: >
          psql "$DB_URL"
          -v ON_ERROR_STOP=1
          -f tests/fixtures/orders_workforce_e2e.sql
      - name: Seed synthetic release-control dataset
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f tests/fixtures/release_e2e.sql
      - name: Seed synthetic Billing-Logistics delivery dataset
        run: >
          psql "$DB_URL"
          -v ON_ERROR_STOP=1
          -f tests/fixtures/logistics_e2e.sql
      - name: Seed synthetic Supply operations dataset
        run: >
          psql "$DB_URL"
          -v ON_ERROR_STOP=1
          -f tests/fixtures/supply_e2e.sql
      - name: Verify Auth and operational session contract
        run: node tests/fixtures/verify-authenticated-e2e-session.mjs
      - name: Prove atomic task claim concurrency
        run: node tests/integration/order-claim-concurrency.mjs
      - name: Prove Orders-Workforce outbox concurrency
        run: node tests/integration/orders-workforce-outbox-concurrency.mjs
      - name: Prove financial concurrency and idempotency
        run: node tests/integration/finance-concurrency.mjs
      - name: Prove inventory concurrency and idempotency
        run: node tests/integration/inventory-concurrency.mjs
      - name: Prove logistics concurrency and idempotency
        run: node tests/integration/logistics-concurrency.mjs
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Authenticated full-domain regression
        run: >
          npx playwright test --workers=1 --project=desktop-chromium
          tests/e2e/authenticated-orders.spec.ts
          tests/e2e/customer-intelligence.spec.ts
          tests/e2e/authenticated-freight.spec.ts
          tests/e2e/authenticated-finance.spec.ts
          tests/e2e/workforce.spec.ts
          tests/e2e/orders-workforce-integration.spec.ts
          tests/e2e/inventory.spec.ts
          tests/e2e/supply.spec.ts
          tests/e2e/authenticated-logistics.spec.ts
          tests/e2e/analytics.spec.ts
          tests/e2e/admin-audit-paco.spec.ts
          tests/e2e/release-accessibility.spec.ts
      - name: Enterprise UAT representative journeys
        run: >
          npx playwright test --workers=1 --project=desktop-chromium
          tests/e2e/uat-enterprise-certification.spec.ts
      - name: Targeted mobile integration smoke
        run: >
          npx playwright test --workers=1
          --project=mobile-android
          --project=mobile-iphone
          tests/e2e/customer-intelligence.spec.ts
          tests/e2e/workforce.spec.ts
          tests/e2e/authenticated-logistics.spec.ts
      - name: Upload authenticated Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: authenticated-playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog verified secrets
        uses: trufflesecurity/trufflehog@v3.97.5
        with:
          extra_args: --results=verified

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: NPM audit — high severity gate
        run: npm audit --audit-level=high

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, database, e2e-staging, e2e-authenticated, secret-scan, codeql, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Export staging
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_APP_ENV: staging
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - name: Deploy GitHub Pages staging
        id: deployment
        uses: actions/deploy-pages@v5
