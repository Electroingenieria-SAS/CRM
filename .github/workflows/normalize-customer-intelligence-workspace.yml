name: Normalize Customer Intelligence workspace

on:
  push:
    branches:
      - reconstruction/p1-customer-intelligence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-customer-intelligence
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format Customer Intelligence workspace
        run: npx prettier --write src/app/customers/intelligence/customer-intelligence-workspace.tsx
      - name: Commit normalized formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/customers/intelligence/customer-intelligence-workspace.tsx
          git commit -m "style(customer-intelligence): normalize workspace with Prettier"
          git push origin HEAD:reconstruction/p1-customer-intelligence
