name: One-shot Prettier capture

on:
  push:
    branches:
      - release/hilo15-controlled-production-migration
    paths:
      - .github/workflows/format-capture-once.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print exact formatted file
        run: |
          echo "PRETTIER_BASE64_BEGIN"
          npx prettier supabase/functions/migration-source-export/index.ts | base64 -w0
          echo
          echo "PRETTIER_BASE64_END"
