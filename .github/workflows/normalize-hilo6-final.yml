name: Normalize Hilo 6 final delta

on:
  push:
    branches:
      - reconstruction/p1-orders-workforce-automation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-orders-workforce-automation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize final delta
        run: >
          npx prettier --write
          docs/audit/orders-workforce-automation.md
          src/infrastructure/integrations/supabase-order-workforce-outbox-repository.ts
          src/modules/integrations/orders-workforce/application/orders-workforce.schemas.ts
          src/modules/integrations/orders-workforce/application/orders-workforce.ports.ts
          src/modules/integrations/orders-workforce/application/orders-workforce-automation-service.ts
          src/modules/orders/application/order-workflow-observer.ts
          src/modules/orders/application/order-workflow-service.ts
          src/modules/integrations/orders-workforce/application/orders-workforce-mutation-observer.ts
          tests/integration/orders-workforce-lifecycle.test.ts
          tests/unit/order-workflow-service.test.ts
          tests/unit/orders-workforce-automation.test.ts
          tests/unit/orders-workforce-health.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/orders-workforce-automation.md src/infrastructure/integrations/supabase-order-workforce-outbox-repository.ts src/modules/integrations/orders-workforce/application/orders-workforce.schemas.ts src/modules/integrations/orders-workforce/application/orders-workforce.ports.ts src/modules/integrations/orders-workforce/application/orders-workforce-automation-service.ts src/modules/orders/application/order-workflow-observer.ts src/modules/orders/application/order-workflow-service.ts src/modules/integrations/orders-workforce/application/orders-workforce-mutation-observer.ts tests/integration/orders-workforce-lifecycle.test.ts tests/unit/order-workflow-service.test.ts tests/unit/orders-workforce-automation.test.ts tests/unit/orders-workforce-health.test.ts
          git commit -m "style(workforce): normalize final integration delta"
          git push origin HEAD:reconstruction/p1-orders-workforce-automation
