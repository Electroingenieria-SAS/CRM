name: Normalize Hilo 6 closure

on:
  push:
    branches:
      - docs/hilo6-orders-workforce-close-v2

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/hilo6-orders-workforce-close-v2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize closure document
        run: npx prettier --write docs/audit/orders-workforce-automation.md
      - name: Commit normalization and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/normalize-hilo6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audit/orders-workforce-automation.md
          git commit -m "style(docs): apply repository Prettier to Hilo 6 closure"
          git push origin HEAD:docs/hilo6-orders-workforce-close-v2
