name: Vercel preview candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.QA_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.QA_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_ENV: preview
      NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Verify protected Preview configuration
        shell: bash
        run: |
          for key in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            test -n "${!key:-}" || { echo "Missing protected configuration: $key"; exit 2; }
          done
          echo "::add-mask::$VERCEL_TOKEN"
          echo "::add-mask::$NEXT_PUBLIC_SUPABASE_URL"
          echo "::add-mask::$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      - run: npm ci
      - name: Pull Preview project settings
        run: npx vercel@59.20.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Build exact Preview artifact
        run: npx vercel@59.20.0 build --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt Preview
        id: deploy
        shell: bash
        run: |
          URL="$(npx vercel@59.20.0 deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "## Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Deployment note
        run: |
          echo "Preview candidate deployed from commit $GITHUB_SHA."
          echo "Do not promote until Hilo 15 reconciliation and smoke are GREEN."
