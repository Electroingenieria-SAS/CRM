name: Temporary analytics formatter

on:
  push:
    branches:
      - reconstruction/p1-analytics-vsm-reports
    paths:
      - .github/workflows/format-analytics-temp.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-analytics-vsm-reports
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format analytics files with repository Prettier
        run: >
          npx prettier --write
          docs/analytics/kpi-catalog.md
          docs/architecture/analytics-vsm-reports.md
          src/app/analytics/analytics-controls.tsx
          src/app/analytics/dashboard-sections.tsx
          src/app/analytics/import-sections.tsx
          src/app/analytics/report-sections.tsx
          src/app/analytics/reports/page.tsx
          src/app/analytics/use-analytics-reports-page.ts
          src/app/analytics/use-analytics-session.ts
          src/app/analytics/use-analytics-vsm-page.ts
          src/app/analytics/vsm-sections.tsx
          src/app/analytics/vsm/page.tsx
          src/modules/analytics/application/analytics-service.ts
          src/modules/analytics/domain/csv.ts
          tests/e2e/analytics.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/analytics docs/architecture/analytics-vsm-reports.md src/app/analytics src/modules/analytics tests/e2e/analytics.spec.ts
          git commit -m "style(analytics): apply repository prettier"
          git push origin HEAD:reconstruction/p1-analytics-vsm-reports
