name: Normalize Orders Workflow

on:
  push:
    branches:
      - reconstruction/p1-orders-operational-workflow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-orders-operational-workflow
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier
        run: >
          npx prettier --write
          "src/**/*.{ts,tsx,css}"
          "tests/**/*.{ts,mjs}"
          "docs/**/*.md"
          ".github/workflows/pipeline.yml"
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs .github/workflows/pipeline.yml
          git commit -m "style(orders): apply repository Prettier"
          git push origin HEAD:reconstruction/p1-orders-operational-workflow
