name: Normalize PR6 final

on:
  push:
    branches:
      - reconstruction/p1-auth-orders-ui-e2e

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-auth-orders-ui-e2e
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write .github/workflows/pipeline.yml docs/audit docs/deployment src tests/e2e tests/unit
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pipeline.yml docs/audit docs/deployment src tests/e2e tests/unit
          git commit -m "style: normalize final authenticated UI tranche"
          git push origin HEAD:reconstruction/p1-auth-orders-ui-e2e
