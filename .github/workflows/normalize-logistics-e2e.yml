name: Normalize logistics E2E

on:
  push:
    branches:
      - reconstruction/p1-billing-logistics-delivery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-billing-logistics-delivery
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/authenticated-logistics.spec.ts
      - name: Commit exact Prettier output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/authenticated-logistics.spec.ts
          git commit -m "style(test): apply exact Prettier output"
          git push origin HEAD:reconstruction/p1-billing-logistics-delivery
