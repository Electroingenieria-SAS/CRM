name: Freight formatting helper

on:
  push:
    branches:
      - reconstruction/p1-freight-intelligence

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-freight-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format changed text artifacts
        shell: bash
        run: |
          git fetch origin main
          mapfile -t files < <(
            git diff --name-only origin/main...HEAD |
            grep -E '\.(ts|tsx|js|mjs|css|md|ya?ml|json)$' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          npx prettier --write "${files[@]}"
      - name: Commit normalized formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(freight): apply repository Prettier"
          git push origin HEAD:reconstruction/p1-freight-intelligence
