name: One-shot branch formatter

on:
  push:
    branches:
      - reconstruction/p1-admin-audit-assistant-release
    paths:
      - .github/workflows/format-branch.yml

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-admin-audit-assistant-release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/modules/assistant/domain/spanish-intent.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/assistant/domain/spanish-intent.ts
          git commit -m "chore(format): format PACO intent [formatted]"
          git push origin HEAD:reconstruction/p1-admin-audit-assistant-release
