name: Normalize Hilo 6 final integration

on:
  push:
    branches:
      - reconstruction/p1-orders-workforce-automation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p1-orders-workforce-automation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize Hilo 6 files
        run: >
          npx prettier --write
          docs/ADR/ADR-0005-orders-workforce-outbox.md
          docs/architecture/orders-workforce-automation.md
          docs/audit/orders-workforce-automation.md
          docs/audit/master-matrix.md
          docs/audit/functional-parity.md
          docs/database/orders-workforce-contract.md
          src/app/operations/orders-workforce
          src/composition/browser-application.ts
          src/composition/orders-workforce-browser-application.ts
          src/infrastructure/integrations
          src/modules/integrations/orders-workforce
          src/modules/orders/application/order-workflow-observer.ts
          src/modules/orders/application/order-workflow-service.ts
          tests/e2e/operational-order-workflow.spec.ts
          tests/e2e/orders-workforce-integration.spec.ts
          tests/fixtures/create-authenticated-e2e-users.mjs
          tests/unit/order-workflow-workforce-gate.test.ts
          tests/unit/orders-workforce-automation.test.ts
          tests/unit/orders-workforce-health.test.ts
          tests/integration/orders-workforce-lifecycle.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ADR/ADR-0005-orders-workforce-outbox.md docs/architecture/orders-workforce-automation.md docs/audit/orders-workforce-automation.md docs/audit/master-matrix.md docs/audit/functional-parity.md docs/database/orders-workforce-contract.md src/app/operations/orders-workforce src/composition/browser-application.ts src/composition/orders-workforce-browser-application.ts src/infrastructure/integrations src/modules/integrations/orders-workforce src/modules/orders/application/order-workflow-observer.ts src/modules/orders/application/order-workflow-service.ts tests/e2e/operational-order-workflow.spec.ts tests/e2e/orders-workforce-integration.spec.ts tests/fixtures/create-authenticated-e2e-users.mjs tests/unit/order-workflow-workforce-gate.test.ts tests/unit/orders-workforce-automation.test.ts tests/unit/orders-workforce-health.test.ts tests/integration/orders-workforce-lifecycle.test.ts
          git commit -m "style(workforce): normalize final Hilo 6 integration"
          git push origin HEAD:reconstruction/p1-orders-workforce-automation
