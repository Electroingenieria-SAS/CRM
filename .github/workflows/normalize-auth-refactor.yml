name: Normalize auth refactor

on:
  push:
    branches:
      - reconstruction/p0-auth-security-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: reconstruction/p0-auth-security-foundation
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/modules/auth/application/auth-gateway.ts src/infrastructure/auth/supabase-auth-gateway.ts
      - name: Commit normalization
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/auth/application/auth-gateway.ts src/infrastructure/auth/supabase-auth-gateway.ts
          git commit -m "style(auth): apply repository Prettier"
          git push origin HEAD:reconstruction/p0-auth-security-foundation
